# Example gateway configuration (synthetic hosts). Every key is optional except routes.
listen.host=127.0.0.1
listen.port=8080
max.body.bytes=1048576

# Deadlines: used when the client sends no X-Request-Deadline-Ms; client values are clamped to max.
deadline.default.ms=5000
deadline.max.ms=30000
try.timeout.ms=2000

retry.max.attempts=3
retry.base.backoff.ms=25
retry.max.backoff.ms=500
retry.budget.percent=20
retry.budget.min=3
retry.budget.window.ms=10000
retry.statuses=500,502,503,504

ratelimit.capacity=50
ratelimit.refill.per.sec=25

breaker.enabled=true
breaker.window=20
breaker.min.calls=10
breaker.failure.rate=0.5
breaker.open.ms=5000
breaker.half.open.permits=1

health.eject.after=3
health.eject.ms=5000

route.api.prefix=/api
route.api.upstreams=http://10.0.0.11:9001,http://10.0.0.12:9001
route.api.balancer=least_in_flight
route.api.strip_prefix=false

route.static.prefix=/static
route.static.upstreams=http://10.0.0.21:8080
route.static.balancer=round_robin
route.static.strip_prefix=true
